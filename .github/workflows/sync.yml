name: sync
on:
  workflow_dispatch:
    inputs:
      upload:
        description: "上傳到 Notion"
        type: boolean
        default: false
  schedule:
    - cron: "0 2 * 2-3 1"
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests pdfplumber openpyxl
      - name: Run python main.py
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          NOTION_DATABASE_URL: ${{ secrets.NOTION_DATABASE_URL }}
          UPLOAD: ${{ (github.event_name == 'schedule' || inputs.upload) && '1' || '0' }}
        run: python main.py
      - uses: actions/upload-artifact@v4
        with:
          name: fubon-excel
          path: "*.xlsx"
          if-no-files-found: error
